<section class="my-card py-3 px-2">
    <div class="text-end">
        <span (click)="onClose()" class="text-danger pointer"><i class="fa-solid fa-xmark-circle fa-2x"></i></span>
    </div>
    <div class="text-center">
        <div>
            <img src="../../../assets/images/delete.png" alt="delete" class="">
        </div>
        <h3>{{'devices.delete_item' |translate}}</h3>
        <p *ngIf="currentLang == 'en'">{{'devices.sure_delete'|translate}}<span
                class="text-success text-capitalize fw-bold">{{data.title}} {{data.name_en}}</span></p>
        <p *ngIf="currentLang == 'ar'">{{'devices.sure_delete'|translate}}<span
                class="text-success text-capitalize fw-bold">{{data.title}} {{data.name_ar}}</span></p>
        <button [mat-dialog-close]="data" class="btn btn-outline-danger py-1 px-3 my-2">{{'devices.delete'|translate}}</button>
    </div>
</section>
