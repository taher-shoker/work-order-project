<div class="notifications-container">
  <div class="header">
    <div class="title">
      <i class="fas fa-bell"></i>
      <span>الإشعارات</span>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">جارٍ تحميل الإشعارات...</div>

  <div *ngIf="!isLoading && notifications.length === 0" class="empty">
    لا توجد إشعارات حالياً
  </div>

  <div class="notifications-list" *ngIf="!isLoading && notifications.length > 0">
    <div class="notification-card" *ngFor="let notif of notifications" [class.urgent]="notif.urgent">
      <a [routerLink]="['/dashboard/work-orders/view', notif.work_order_id]" class="card-link">
        <!-- Adjust path as needed -->
        <div class="content">
          <div class="icon">
            <img src="assets/images/notification-icon.png" alt="icon" />
          </div>
          <div class="info">
            <div class="title">{{ notif.title }}</div>
            <div class="message">{{ notif.body }}</div>
          </div>
        </div>
        <div class="time">{{ notif.created_at | timeAgo }}</div>
      </a>
    </div>

  </div>

</div>
