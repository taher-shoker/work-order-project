<section class="container">
    <div class="row align-items-center">
        <div class="col-md-6 p-3">
            <div class="title mb-2">
                <p><a routerLink="/dashboard/admin/devices">{{'devices.devices' | translate}}</a> >>
                    <span>{{'devices.add_device' | translate}}</span>
                </p>
            </div>
        </div>
        <div class="px-4">
            <div class="shadow border p-3 rounded-4">
                <p class="bg-title fw-bold">{{'sidebar.devices_information' | translate}}</p>

                <form>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">{{'devices.device_type' |
                                    translate}}</label>
                                <input type="text" class="form-control" id="exampleFormControlInput1"
                                    [placeholder]="this.translate.instant('devices.enter_device_type')" />
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">{{'devices.model' |
                                    translate}}</label>
                                <input type="text" class="form-control" id="exampleFormControlInput1"
                                    [placeholder]="this.translate.instant('devices.enter_model')" />
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">{{'devices.manufacturer' |
                                    translate}}</label>
                                <input type="text" class="form-control" id="exampleFormControlInput1"
                                    [placeholder]="this.translate.instant('devices.enter_manufacturer')" />
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3 d-flex justify-content-end">
                        <button type="button" class="btn btn-light mx-2 px-5"
                            routerLink="/dashboard/admin/devices">{{'devices.cancel'|translate}}</button>
                        <button
                            class="btn btn-primary text-center px-5">{{'devices.add_information'|translate}}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
