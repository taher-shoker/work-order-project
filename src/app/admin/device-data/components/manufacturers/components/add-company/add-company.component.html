<section [dir]="currentLang =='en' ? 'ltr' : 'rtl'">
    <div class="py-5 px-3 rounded-4">
        <div class="d-flex justify-content-around gap-5">
            <span class="rounded-3 px-2 shadow-sm cursor-pointer" (click)="onNoClick()">
                <i class="fas fa-close text-secondary mt-2"></i>
            </span>
            <span class="fs-5">
                {{'devices.add_information'|translate}}
            </span>
            <span></span>
        </div>
        <div mat-dialog-content>
            <form [formGroup]="manufacturersForm">
                <!--  english name -->
                <div>
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label class="text-orange">{{'devices.name_en' | translate}}</mat-label>
                        <input formControlName="name_en" matInput placeholder="{{'devices.name_en' | translate}}" />
                    </mat-form-field>
                </div>
                <!--  arabic name -->
                <div>
                    <mat-form-field appearance="fill" class="w-100">
                        <mat-label class="text-orange">{{'devices.name_ar' | translate}}</mat-label>
                        <input formControlName="name_ar" matInput placeholder="{{'devices.name_ar' | translate}}" />
                    </mat-form-field>
                </div>
            </form>
        </div>
        <div class="text-start">
            <button class="primary mb-2 text-white" [disabled]="manufacturersForm.invalid" mat-button
                [mat-dialog-close]="manufacturersForm" cdkFocusInitial>
                {{'save'|translate }}
            </button>
        </div>
    </div>
</section>
