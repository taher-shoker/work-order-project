<mat-card>
    <mat-form-field class="w-100">
        <mat-label>{{'devices.enter_manufacturer'|translate}}</mat-label>
        <mat-select [(value)]="selectedCompany">
            <div>
                <div class="d-flex justify-content-between p-3">
                    <button mat-button color="warn">{{'devices.delete_all'|translate}}</button>
                    <span>{{'devices.manufacturers_list'|translate}}</span>
                </div>
                <mat-option *ngFor="let company of companies; let i = index" [value]="company">
                    <div class="d-flex justify-content-between">
                        <div>
                            <button mat-icon-button color="warn" (click)="openDeleteManufacturer(company)">
                                <i class="fa-solid fa-trash-can fa-xs"></i>
                            </button>
                            <button mat-icon-button color="primary" (click)="openEditManufacturer(company.id)">
                                <i class="fa-regular fa-pen-to-square fa-xs"></i>
                            </button>
                        </div>
                        <p *ngIf="currentLang=='ar'" class="mt-3">{{ company.name_ar }}</p>
                        <p *ngIf="currentLang=='en'">{{ company.name_en }}</p>
                    </div>
                </mat-option>
            </div>
            <div class="text-end mt-3 px-3">
                <button mat-button color="primary"
                    (click)="openAddManufacturer()">{{'devices.add_information'|translate}}</button>
            </div>
        </mat-select>
    </mat-form-field>
</mat-card>
