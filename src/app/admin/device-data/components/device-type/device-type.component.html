<mat-card>
    <mat-form-field class="w-100">
        <mat-label>{{'devices.enter_device_type'|translate}}</mat-label>
        <mat-select [(value)]="selectedType">
            <div>
                <div class="d-flex justify-content-between p-3">
                    <button mat-button color="warn">{{'devices.delete_all'|translate}}</button>
                    <span>{{'devices.types_list'|translate}}</span>
                </div>
                <mat-option *ngFor="let type of deviceTypes; let i = index" [value]="type">
                    <div class="d-flex justify-content-between">
                        <div>
                            <button mat-icon-button color="warn" (click)="openDeleteDeviceType(type)">
                                <i class="fa-solid fa-trash-can fa-xs"></i>
                            </button>
                            <button mat-icon-button color="primary" (click)="openEditDeviceType(type.id)">
                                <i class="fa-regular fa-pen-to-square fa-xs"></i>
                            </button>
                        </div>
                        <p *ngIf="currentLang=='ar'" class="mt-3">{{ type.name_ar }}</p>
                        <p *ngIf="currentLang=='en'">{{ type.name_en }}</p>
                    </div>
                </mat-option>
            </div>
            <div class="text-end mt-3 px-3">
                <button mat-button color="primary"
                    (click)="openAddDeviceType()">{{'devices.add_type'|translate}}</button>
            </div>
        </mat-select>
    </mat-form-field>
</mat-card>
